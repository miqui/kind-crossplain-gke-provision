# PLACEHOLDERS ONLY. Replace REPLACE_WITH_GCP_PROJECT_ID before applying.
# Credentials are NOT stored in this repo: create the Secret out-of-band (see README).
apiVersion: gcp.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  projectID: REPLACE_WITH_GCP_PROJECT_ID
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: gcp-credentials
      key: credentials
